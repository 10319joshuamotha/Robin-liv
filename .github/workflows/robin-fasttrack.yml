name: Robin fast-track validation

on:
  push:
    branches: [main, robin-fasttrack-build]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pillow mss opencv-python

      - name: Compile Python sources
        run: |
          python -m compileall -q .

      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q
