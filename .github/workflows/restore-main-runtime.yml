name: Restore Robin runtime

on:
  push:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[skip runtime restore]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last known-good runtime
        run: |
          git checkout f678509175950c08ac14b5485fffd39fa122028b -- main.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          if git diff --cached --quiet; then
            echo "main.py already matches the known-good runtime"
            exit 0
          fi
          git commit -m "Restore full Robin runtime [skip runtime restore]"
          git push
